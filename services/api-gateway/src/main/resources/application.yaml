server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            # ==========================
            # IDENTITY SERVICE
            # ==========================
            - id: identity-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**

            # ==========================
            # TICKET SERVICE
            # ==========================
            - id: ticket-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/tickets/**

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - gateway

  endpoint:
    health:
      show-details: never

security:
  jwt:
    secret: ${JWT_SECRET}